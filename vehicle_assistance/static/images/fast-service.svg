<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="#f0f3ff" rx="15"/>
  
  <!-- Speedometer/gauge circle -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="#ddd" stroke-width="3"/>
  <circle cx="100" cy="100" r="65" fill="none" stroke="#4361ee" stroke-width="8" stroke-dasharray="205 410" opacity="0.7"/>
  
  <!-- Speed lines -->
  <line x1="40" y1="100" x2="20" y2="100" stroke="#f72585" stroke-width="4" stroke-linecap="round"/>
  <line x1="160" y1="100" x2="180" y2="100" stroke="#f72585" stroke-width="4" stroke-linecap="round"/>
  <line x1="60" y1="60" x2="45" y2="45" stroke="#f72585" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Needle -->
  <g transform="translate(100, 100)">
    <line x1="0" y1="0" x2="40" y2="-20" stroke="#ff6b6b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="6" fill="#ff6b6b"/>
  </g>
  
  <!-- Center hub -->
  <circle cx="100" cy="100" r="8" fill="#333"/>
</svg>