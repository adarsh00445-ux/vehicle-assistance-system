{% extends "base.html" %}

{% block title %}Error - Vehicle Assistance System{% endblock %}

{% block content %}
<div class="error-page">
    <div class="container">
        <div class="error-content">
            <h1 class="error-code">⚠️</h1>
            <h2 class="error-title">Oops! Something went wrong</h2>
            <p class="error-message">{{ error or 'An unexpected error occurred.' }}</p>
            <a href="{{ url_for('home') }}" class="btn btn-primary">Go to Home</a>
        </div>
    </div>
</div>
{% endblock %}
