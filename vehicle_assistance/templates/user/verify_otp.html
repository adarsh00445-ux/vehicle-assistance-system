{% extends "base.html" %}
{% from "_auth_macros.html" import otp_field %}

{% block title %}Verify OTP - Vehicle Assistance System{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-box">
        <h2>Verify OTP</h2>
        <p class="auth-subtitle">We've sent a 6-digit code to <strong>{{ email }}</strong></p>
        <form method="POST" action="{{ url_for('user_verify_otp') }}" id="otpForm">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            {{ otp_field() }}
            <button type="submit" class="btn btn-primary btn-block">Verify OTP</button>
        </form>
        <div class="auth-links">
            <p>
                Didn't receive code?
                <a href="{{ url_for('user_resend_otp') }}">Resend OTP</a>
                | <a href="{{ url_for('user_register') }}">Go back</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
