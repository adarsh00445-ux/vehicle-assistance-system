{% extends "base.html" %}

{% block title %}Register Staff - Vehicle Assistance System{% endblock %}

{% block content %}
<div class="admin-form-container">
    <div class="container">
        <div class="form-header">
            <h1>👨‍🔧 Register New Staff</h1>
            <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">← Back</a>
        </div>

        <div class="form-box">
            <form method="POST" action="{{ url_for('admin_register_staff') }}" id="registerStaffForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Full Name *</label>
                        <input type="text" id="name" name="name"
                               placeholder="Enter staff name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address *</label>
                        <input type="email" id="email" name="email"
                               placeholder="Enter email" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="phone">Phone Number *</label>
                        <input type="tel" id="phone" name="phone"
                               placeholder="10-digit phone" maxlength="10" required>
                    </div>
                    <div class="form-group">
                        <label for="specialization">Specialization</label>
                        <select id="specialization" name="specialization">
                            <option value="General">General Mechanic</option>
                            <option value="Engine">Engine Specialist</option>
                            <option value="Electrical">Electrical Specialist</option>
                            <option value="Tire">Tire Specialist</option>
                            <option value="AC">AC Specialist</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password *</label>
                    <input type="password" id="password" name="password"
                           placeholder="Minimum 6 characters" required>
                </div>

                <button type="submit" class="btn btn-primary btn-large btn-block">
                    Register Staff
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
